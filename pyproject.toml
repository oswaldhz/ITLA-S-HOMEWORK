[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opensong-next"
version = "0.1.0"
description = "Hybrid Qt/FastAPI companion for controlling projection workflows"
authors = [{ name = "OpenSong Next" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.25",
    "reportlab>=4.0",
    "pyinstaller>=6.0",
]

[project.scripts]
opensong-next = "opensong_next.app:main"

[tool.pyinstaller]
name = "opensong-next"
entry-point = "opensong_next.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["opensong_next"]
